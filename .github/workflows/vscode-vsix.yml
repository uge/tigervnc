name: VS Code VSIX

on:
  workflow_dispatch:
  push:
    paths:
      - contrib/vscode-vnc-tcp/**
      - contrib/web-vnc-client/**
      - .github/workflows/vscode-vsix.yml
  pull_request:
    paths:
      - contrib/vscode-vnc-tcp/**
      - contrib/web-vnc-client/**
      - .github/workflows/vscode-vsix.yml

jobs:
  package-vsix:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate extension directory
        run: |
          test -f contrib/vscode-vnc-tcp/package.json || {
            echo "Missing contrib/vscode-vnc-tcp/package.json"
            exit 1
          }

      - name: Build web-vnc-client
        working-directory: contrib/web-vnc-client
        run: |
          npm ci
          npm run build

      - name: Install extension dependencies
        working-directory: contrib/vscode-vnc-tcp
        run: npm ci

      - name: Package VSIX
        working-directory: contrib/vscode-vnc-tcp
        run: npm run package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: tigervnc-vscode-vsix
          path: contrib/vscode-vnc-tcp/*.vsix
          if-no-files-found: error
